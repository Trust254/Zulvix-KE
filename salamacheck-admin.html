<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SalamaCheck Admin</title><script src="https://cdn.tailwindcss.com"></script><style>body{background:#07130f;color:#e8f6ef;font-family:system-ui,sans-serif}.card{background:#10221b;border:1px solid #244638;border-radius:16px;padding:16px}.muted{color:#9ab5ab}</style></head><body class="p-4 md:p-8"><main class="max-w-6xl mx-auto"><div class="flex justify-between items-center mb-6"><div><div class="text-2xl font-black text-emerald-300">SalamaCheck Admin</div><p class="text-sm muted">Emergency incidents and safety monitoring</p></div><a href="./index.html" class="text-sm text-emerald-300 underline">Back to Zulvix</a></div><div id="error" class="hidden card border-red-500/40 text-red-200 mb-4"></div><div id="stats" class="grid grid-cols-2 md:grid-cols-3 gap-3 mb-5"></div><section class="card"><div class="flex justify-between items-center mb-4"><h2 class="font-bold text-lg">Recent incidents</h2><button id="refresh" class="bg-emerald-400 text-black font-bold rounded-lg px-3 py-2 text-sm">Refresh</button></div><div id="incidents" class="space-y-2"><p class="muted text-sm">Loading…</p></div></section><p class="muted text-xs mt-5">This panel displays incident records and pending external-delivery counts. It does not dispatch emergency services.</main><script>const API='https://zulvix-ke-backend.onrender.com',token=localStorage.getItem('zulvix_admin_token');const $=id=>document.getElementById(id);function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}async function load(){const r=await fetch(API+'/api/admin/salamacheck/overview',{headers:{Authorization:'Bearer '+token}}),d=await r.json();if(!r.ok)throw Error(d.message||'Admin authorization required');$('stats').innerHTML=[['Active protections',d.active_protections],['Active check-in schedules',d.active_checkins],['Alerts awaiting SMS/email provider',d.awaiting_provider]].map(x=>'<div class="card"><div class="muted text-xs">'+x[0]+'</div><div class="text-3xl font-black text-emerald-300 mt-2">'+Number(x[1]||0)+'</div></div>').join('');$('incidents').innerHTML=d.incidents?.length?d.incidents.map(i=>'<div class="rounded-xl border border-white/10 bg-black/20 p-3 flex flex-wrap justify-between gap-2"><div><b>'+esc(i.incident_type==='sos'?'SOS alert':'Welfare check')+'</b><div class="muted text-xs mt-1">Member ID: '+esc(i.user_id)+'</div><div class="muted text-xs">'+esc(new Date(i.created_at).toLocaleString())+'</div></div><span class="text-xs uppercase text-amber-300">'+esc(i.status)+'</span></div>').join(''):'<p class="muted text-sm">No incidents recorded.</p>';}catch(e){$('error').textContent=e.message;$('error').classList.remove('hidden');} $('refresh').onclick=()=>load();if(!token){$('error').textContent='Admin session not found. Sign in through the Zulvix-KE admin portal first.';$('error').classList.remove('hidden')}else load();</script></body></html>
